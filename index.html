    <p data-template-id="certificate-subtitle" class="canva-text mt-1 text-xs text-gray-500"></p>
    <div data-template-id="certificate-copy-panel" class="canva-panel my-6 space-y-2 rounded-2xl border border-amber-200 p-4 text-left">
     <p data-template-id="certificate-intro" class="canva-text text-sm text-gray-700"></p>
     <p id="cert-name" class="text-center text-xl font-black text-amber-900 underline">小達人</p>
     <p data-template-id="certificate-copy" class="canva-text text-xs leading-relaxed text-gray-600"></p>
     <p id="cert-date" class="pt-2 text-right text-xs font-bold text-amber-800"></p>
    </div><button id="certificate-close-button" type="button" data-template-id="certificate-close-button" class="canva-button w-full rounded-xl py-3 font-bold shadow-lg"></button>
   </div>
  </div>
  <script src="/_sdk/2d77f6da28d2db67.editing_sdk.js" integrity="sha512-J2amlRCt1kRxG+KsIIrigl/2D8tdwu2dYL445oeyjdtw4o+kHc2ulDQY9K62zncyUGQOQtw3RmPXZJwLF2WCRQ=="></script>
  <script>
    const currentOrder = [];
    const correctOrder = ["B", "C", "A"];

    function showModal(title, message, icon) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-message").textContent = message;
      document.getElementById("modal-icon").textContent = icon || "💡";
      document.getElementById("custom-modal").classList.remove("hidden");
      document.getElementById("custom-modal").classList.add("flex");
    }

    function closeModal() {
      document.getElementById("custom-modal").classList.add("hidden");
      document.getElementById("custom-modal").classList.remove("flex");
    }

    function updateOrderCards() {
      document.querySelectorAll("[data-step]").forEach((button) => {
        const index = currentOrder.indexOf(button.dataset.step);
        const selected = index !== -1;
        button.classList.toggle("bg-orange-100", selected);
        button.classList.toggle("border-orange-500", selected);
        button.querySelector(".order-badge").textContent = selected ? index + 1 : "?";
      });

      const feedback = document.getElementById("order-feedback");
      if (currentOrder.length !== 3) {
        feedback.classList.add("hidden");
        return;
      }

      const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(correctOrder);
      feedback.classList.remove("hidden");
      feedback.textContent = isCorrect
        ? "✅ 太棒了！正確順序是：先自己想一想，再請 AI 幫忙，最後反思自己有沒有真正學會！"
        : "💡 提示：最佳順序是先獨立思考、卡關時請 AI 幫忙，最後再檢查自己是否真的學會。點選已選步驟可取消後重試。";
      feedback.className = isCorrect
        ? "rounded-xl border border-emerald-300 bg-emerald-100 p-3 text-sm font-bold text-emerald-900"
        : "rounded-xl border border-amber-300 bg-amber-100 p-3 text-sm font-bold text-amber-900";
    }

    function checkVerification() {
      const checked = Array.from(document.querySelectorAll('input[name="verify"]:checked')).map((input) => input.value);
      const feedback = document.getElementById("verify-feedback");
      feedback.classList.remove("hidden");

      if (checked.includes("A")) {
        feedback.textContent = "❌ 直接相信 AI 並寫進作業可能會出錯。AI 有時會產生看似合理、其實不正確的資訊，因此需要查證。";
        feedback.className = "rounded-xl border border-rose-300 bg-rose-100 p-4 text-sm font-medium text-rose-900";
      } else if (checked.length >= 2) {
        feedback.textContent = "✅ 太棒了！多查閱不同資料、詢問師長並主動修正錯誤，是負責任使用 AI 的好方法。";
        feedback.className = "rounded-xl border border-emerald-300 bg-emerald-100 p-4 text-sm font-medium text-emerald-900";
      } else {
        feedback.textContent = "💡 提示：可選擇多翻書、多比較資料來源、詢問老師家長，或在發現錯誤時主動修正。";
        feedback.className = "rounded-xl border border-blue-300 bg-blue-100 p-4 text-sm font-medium text-blue-900";
      }
    }

    function updateProgress() {
      const count = document.querySelectorAll(".creative-choice:checked").length;
      const percent = Math.round((count / 3) * 100);
      document.getElementById("progress-bar").style.width = percent + "%";
      document.getElementById("progress-text").textContent = "目前進度：" + percent + "%";
    }

    function finishWorksheet() {
      const answersCorrect =
        document.getElementById("match-1").value === "C" &&
        document.getElementById("match-2").value === "A" &&
        document.getElementById("match-3").value === "B";

      if (!answersCorrect) {
        showModal(
          "提示：第三關配對尚未完全正確",
          "請再檢查：\n(1) 個人資料 → C 保護隱私\n(2) 直接複製作文 → A 自己思考完成作業\n(3) 對 AI 說請與謝謝 → B 保持有禮貌的互動",
          "🔍"
        );
        return;
      }

      const name = document.getElementById("user-name-input").value.trim() ||
        document.getElementById("signature-input").value.trim() || "小達人";
      const date = document.getElementById("date-input").value || new Date().toISOString().split("T")[0];

      document.getElementById("cert-name").textContent = name;
      document.getElementById("cert-date").textContent = "頒發日期：" + date;
      document.getElementById("success-overlay").classList.remove("hidden");
      document.getElementById("success-overlay").classList.add("flex");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("date-input").value = new Date().toISOString().split("T")[0];

      document.getElementById("expert-mode-toggle").addEventListener("change", (event) => {
        document.querySelectorAll(".expert-card").forEach((card) => card.classList.toggle("hidden", !event.target.checked));
        if (event.target.checked) {
          showModal("人權巡檢模式已啟動", "已開啟人權專家觀察點，可以對照每一關背後的人權與倫理核心價值。", "👁️");
        }
      });

      document.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          const step = button.dataset.step;
          const index = currentOrder.indexOf(step);
          if (index > -1) currentOrder.splice(index, 1);
          else if (currentOrder.length < 3) currentOrder.push(step);
          updateOrderCards();
        });
      });

      document.getElementById("verify-button").addEventListener("click", checkVerification);
      document.querySelectorAll(".creative-choice").forEach((input) => input.addEventListener("change", updateProgress));
      document.getElementById("finish-button").addEventListener("click", finishWorksheet);
      document.getElementById("modal-close-button").addEventListener("click", closeModal);
      document.getElementById("certificate-close-button").addEventListener("click", () => {
        document.getElementById("success-overlay").classList.add("hidden");
        document.getElementById("success-overlay").classList.remove("flex");
      });

      lucide.createIcons();
    });
  </script>
 </body>
</html>
